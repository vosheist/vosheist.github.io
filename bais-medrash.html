    <script>
        const SESSION_KEY = "yeshivaChillCurrentUser";

        function escapeHtml(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#39;");
        }

        async function renderPosts() {
            const response = await window.yeshivaChillApi.getBaisMedrash();
            const posts = (response.posts || []).slice().reverse();
            const list = document.getElementById("bm-list");

            if (!posts.length) {
                list.innerHTML = '<article class="community-card"><p class="community-meta">??????? ???? ?????? ??????.</p></article>';
                return;
            }

            list.innerHTML = posts.map((post) => {
                const notes = post.notes ? `<p class="member-board-meta"><strong>??????:</strong> ${escapeHtml(post.notes)}</p>` : "";
                return `<article class="community-card"><p class="community-name">${escapeHtml(post.nickname)}</p><p class="member-board-meta"><strong>????:</strong> ${escapeHtml(post.time)}</p><p class="member-board-meta"><strong>????:</strong> ${escapeHtml(post.length)}</p><p class="member-board-meta"><strong>?????:</strong> ${escapeHtml(post.limud)}</p><p class="member-board-meta"><strong>?????:</strong> ${escapeHtml(post.style)}</p>${notes}</article>`;
            }).join("");
        }

        document.getElementById("chavrusa-form").addEventListener("submit", async (event) => {
            event.preventDefault();
            const message = document.getElementById("bm-message");
            const currentUserKey = sessionStorage.getItem(SESSION_KEY);
            let currentUser = null;

            try {
                const userResponse = await window.yeshivaChillApi.getUser(currentUserKey);
                currentUser = userResponse.user;
            } catch {
                currentUser = null;
            }

            const time = document.getElementById("bm-time").value.trim();
            const length = document.getElementById("bm-length").value.trim();
            const limud = document.getElementById("bm-limud").value.trim();
            const style = document.getElementById("bm-style").value;
            const notes = document.getElementById("bm-notes").value.trim();

            if (!currentUser || !time || !length || !limud || !style) {
                message.textContent = "???? ??? ???? ??? ??????.";
                message.className = "auth-message error mt-2";
                return;
            }

            await window.yeshivaChillApi.addBaisMedrash({
                nickname: currentUser.nickname || currentUser.displayName || "???????",
                time,
                length,
                limud,
                style,
                notes
            });

            event.target.reset();
            message.textContent = "???? ????? ??? ????????????.";
            message.className = "auth-message success mt-2";
            await renderPosts();
        });

        renderPosts().catch((error) => {
            console.error(error);
            const list = document.getElementById("bm-list");
            list.innerHTML = '<article class="community-card"><p class="community-meta">???? ?????? ????? ?? ?????? ????.</p></article>';
        });
    </script>
