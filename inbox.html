<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="/css/styles.css" rel="stylesheet">
</head>

<body>
    <div id="my-navbar">
        <nav class="navbar navbar-expand-lg rtl-navbar">
            <div class="container-fluid">
                <a class="navbar-brand" href="/index.html" aria-label="Yeshiva Chill">

                        <span class="brand-words">

                            <span class="brand-heist">טשיל</span>
                        </span>
                        <span class="brand-tes"></span>
                        <span class="brand-marks">
                            <span class="brand-mark brand-mark-one">?</span>
                            <span class="brand-mark brand-mark-two">?</span>
                            <span class="brand-mark brand-mark-three">?</span>
                        </span>
                    </span>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item"><a class="nav-link" href="/community.html">קהילה</a></li>
                        <li class="nav-item"><a class="nav-link" href="/bais-medrash.html">בית מדרש</a></li>
                        <li class="nav-item"><a class="nav-link" href="/coffee-room.html">קאווע צימער</a></li>

    </div>

    <section class="community-section">
        <div class="community-wrap">
            <div class="community-topbar mb-3">
                <h1 class="mb-0">Inbox</h1>
                <a class="btn btn-outline-primary btn-sm" href="/community.html">Back To Community</a>
            </div>

            <ul class="nav nav-tabs mb-3" id="inboxTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="messages-tab" data-bs-toggle="tab" data-bs-target="#messages-pane"
                        type="button" role="tab" aria-controls="messages-pane" aria-selected="true">Messages</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="invites-tab" data-bs-toggle="tab" data-bs-target="#invites-pane"
                        type="button" role="tab" aria-controls="invites-pane" aria-selected="false">Invites</button>
                </li>
            </ul>

            <div class="tab-content">
                <div class="tab-pane fade show active" id="messages-pane" role="tabpanel" aria-labelledby="messages-tab">
                    <div class="inbox-layout">
                        <aside class="inbox-list-shell">
                            <h2 class="h6 mb-2">Conversations</h2>
                            <div id="conversation-list" class="inbox-list"></div>
                        </aside>
                        <article class="thread-shell">
                            <div class="thread-header">
                                <h2 class="h6 mb-0" id="thread-title">Pick a conversation</h2>
                            </div>
                            <div id="thread-messages" class="thread-messages"></div>
                            <form id="thread-form" class="thread-compose mt-2 d-none">
                                <textarea id="thread-input" class="form-control" rows="3" maxlength="500" required></textarea>
                                <div class="d-flex justify-content-end mt-2">
                                    <button id="thread-send-btn" class="btn auth-btn" type="submit">Send</button>
                                </div>
                                <p id="thread-status" class="auth-message mt-1" aria-live="polite"></p>
                            </form>
                        </article>
                    </div>
                </div>

                <div class="tab-pane fade" id="invites-pane" role="tabpanel" aria-labelledby="invites-tab">
                    <div id="invite-list" class="invite-list"></div>
                </div>
            </div>
        </div>
    </section>

    <footer class="site-footer">
        <div class="container-fluid d-flex justify-content-center align-items-center py-3">
            <p class="site-footer-text">&copy; 2026 Yeshiva Chill</p>
        </div>
    </footer>

    <script src="/js/script.js"></script>
    <script src="/js/api.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script>
        const SESSION_KEY = "yeshivaChillCurrentUser";
        const currentUserKey = sessionStorage.getItem(SESSION_KEY);
        let selectedConversation = null;
        let conversations = [];

        if (!currentUserKey) {
            window.location.href = "/nafshi.html";
        }

        function escapeHtml(value) {
            return String(value || "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#39;");
        }

        function setStatus(id, text, type) {
            const el = document.getElementById(id);
            if (!el) return;
            el.textContent = text;
            el.classList.remove("error", "success");
            if (type) {
                el.classList.add(type);
            }
        }

        function renderConversations() {
            const list = document.getElementById("conversation-list");
            if (!conversations.length) {
                list.innerHTML = '<div class="community-card"><p class="community-meta mb-0">No private messages yet.</p></div>';
                return;
            }

            list.innerHTML = conversations.map((item) => {
                const unreadBadge = item.unreadCount > 0 ? `<span class="badge text-bg-primary">${item.unreadCount}</span>` : "";
                const activeClass = selectedConversation && selectedConversation.partnerUserKey === item.partnerUserKey ? " is-active" : "";
                return [
                    `<button type="button" class="inbox-conversation${activeClass}" data-partner-key="${escapeHtml(item.partnerUserKey)}">`,
                    `<span class="fw-semibold">${escapeHtml(item.partnerPublicName || item.partnerUserKey)}</span> ${unreadBadge}`,
                    `<small class="d-block text-secondary mt-1">${escapeHtml(item.lastMessage || "")}</small>`,
                    `</button>`
                ].join("");
            }).join("");

            list.querySelectorAll(".inbox-conversation").forEach((button) => {
                button.addEventListener("click", async () => {
                    const partnerKey = button.getAttribute("data-partner-key");
                    selectedConversation = conversations.find((entry) => entry.partnerUserKey === partnerKey) || null;
                    renderConversations();
                    await loadThread();
                });
            });
        }

        async function loadConversations() {
            const response = await window.yeshivaChillApi.getMessageConversations(currentUserKey);
            conversations = response.conversations || [];
            renderConversations();
        }

        async function loadThread() {
            const title = document.getElementById("thread-title");
            const messagesEl = document.getElementById("thread-messages");
            const form = document.getElementById("thread-form");

            if (!selectedConversation) {
                title.textContent = "Pick a conversation";
                messagesEl.innerHTML = '<div class="community-card"><p class="community-meta mb-0">Select a member from the left.</p></div>';
                form.classList.add("d-none");
                return;
            }

            const response = await window.yeshivaChillApi.getMessageThread(currentUserKey, selectedConversation.partnerUserKey);
            const threadMessages = response.messages || [];

            title.textContent = `Chat with ${response.thread.otherPublicName || selectedConversation.partnerUserKey}`;
            form.classList.remove("d-none");

            if (!threadMessages.length) {
                messagesEl.innerHTML = '<div class="community-card"><p class="community-meta mb-0">No messages yet. Start the conversation.</p></div>';
            } else {
                messagesEl.innerHTML = threadMessages.map((msg) => {
                    const mine = msg.fromUserKey === currentUserKey;
                    const cls = mine ? "thread-bubble thread-bubble-me" : "thread-bubble thread-bubble-them";
                    const when = msg.createdAt ? new Date(msg.createdAt).toLocaleString() : "";
                    return [
                        `<div class="${cls}">`,
                        `<p class="mb-1">${escapeHtml(msg.message)}</p>`,
                        `<small class="text-secondary">${escapeHtml(when)}</small>`,
                        `</div>`
                    ].join("");
                }).join("");
            }

            await window.yeshivaChillApi.markThreadRead(currentUserKey, selectedConversation.partnerUserKey);
            await loadConversations();
        }

        async function loadInvites() {
            const list = document.getElementById("invite-list");
            const response = await window.yeshivaChillApi.getInvites(currentUserKey);
            const invites = (response.invites || []).filter((invite) => invite.toUserKey === currentUserKey || invite.fromUserKey === currentUserKey);

            if (!invites.length) {
                list.innerHTML = '<div class="community-card"><p class="community-meta mb-0">No invites yet.</p></div>';
                return;
            }

            list.innerHTML = invites.map((invite) => {
                const isRecipient = invite.toUserKey === currentUserKey;
                const isPendingRecipient = isRecipient && invite.status === "pending";
                const scheduled = invite.proposedTime ? new Date(invite.proposedTime).toLocaleString() : "Not set";
                const note = invite.note ? `<p class="community-meta mb-1">Note: ${escapeHtml(invite.note)}</p>` : "";
                return [
                    `<article class="community-card mb-2" data-invite-id="${escapeHtml(invite.id)}">`,
                    `<p class="community-name mb-1">${escapeHtml(invite.fromPublicName)} invited ${escapeHtml(invite.toPublicName)}</p>`,
                    `<p class="community-meta mb-1">Game: ${escapeHtml(invite.gameKey)}</p>`,
                    `<p class="community-meta mb-1">When: ${escapeHtml(scheduled)}</p>`,
                    `<p class="community-meta mb-1">Status: <strong>${escapeHtml(invite.status)}</strong></p>`,
                    note,
                    isPendingRecipient
                        ? `<div class="d-flex gap-2 mt-2"><button type="button" class="btn btn-sm auth-btn js-invite-accept">Accept</button><button type="button" class="btn btn-sm btn-outline-secondary js-invite-decline">Decline</button></div>`
                        : "",
                    `</article>`
                ].join("");
            }).join("");

            list.querySelectorAll(".js-invite-accept").forEach((button) => {
                button.addEventListener("click", async () => {
                    const card = button.closest("[data-invite-id]");
                    if (!card) return;
                    const inviteId = card.getAttribute("data-invite-id");
                    try {
                        const responseUpdate = await window.yeshivaChillApi.respondToInvite(inviteId, currentUserKey, "accept");
                        const invite = responseUpdate.invite;
                        await loadInvites();
                        if (invite && invite.gamePath) {
                            window.location.href = invite.gamePath;
                        }
                    } catch (error) {
                        alert(String(error.message || "Could not accept invite"));
                    }
                });
            });

            list.querySelectorAll(".js-invite-decline").forEach((button) => {
                button.addEventListener("click", async () => {
                    const card = button.closest("[data-invite-id]");
                    if (!card) return;
                    const inviteId = card.getAttribute("data-invite-id");
                    try {
                        await window.yeshivaChillApi.respondToInvite(inviteId, currentUserKey, "decline");
                        await loadInvites();
                    } catch (error) {
                        alert(String(error.message || "Could not decline invite"));
                    }
                });
            });
        }

        document.getElementById("thread-form").addEventListener("submit", async (event) => {
            event.preventDefault();
            if (!selectedConversation) return;

            const input = document.getElementById("thread-input");
            const sendBtn = document.getElementById("thread-send-btn");
            const text = input.value.trim();
            if (!text) {
                setStatus("thread-status", "Please type a message.", "error");
                return;
            }

            sendBtn.disabled = true;
            try {
                await window.yeshivaChillApi.sendMessageToMember(currentUserKey, selectedConversation.partnerUserKey, text);
                input.value = "";
                setStatus("thread-status", "Sent.", "success");
                await loadThread();
            } catch (error) {
                setStatus("thread-status", String(error.message || "Failed to send"), "error");
            } finally {
                sendBtn.disabled = false;
            }
        });

        Promise.all([loadConversations(), loadInvites()]).catch((error) => {
            console.error(error);
            document.getElementById("conversation-list").innerHTML = '<div class="community-card"><p class="community-meta mb-0">Could not load inbox.</p></div>';
            document.getElementById("invite-list").innerHTML = '<div class="community-card"><p class="community-meta mb-0">Could not load invites.</p></div>';
        });
    </script>
</body>

</html>
