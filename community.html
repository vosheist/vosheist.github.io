<!doctype html>
<html lang="yi" dir="rtl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Yeshiva Chill | Community</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="/css/styles.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Gveret+Levin&family=Playpen+Sans+Hebrew:wght@100..800&family=Rubik+80s+Fade&family=Rubik+Marker+Hatch&display=swap"
        rel="stylesheet">
</head>

<body>
    <div id="my-navbar">
        <nav class="navbar navbar-expand-lg rtl-navbar">
            <div class="container-fluid">
                <a class="navbar-brand" href="/login.html" aria-label="Yeshiva Chill">
                    <span class="brand-lockup" aria-hidden="true">
                        <span class="brand-words">
                            <span class="brand-vos">ישיבה</span>
                            <span class="brand-heist">טשיל</span>
                        </span>
                        <span class="brand-tes"></span>
                        <span class="brand-marks">
                            <span class="brand-mark brand-mark-one">?</span>
                            <span class="brand-mark brand-mark-two">?</span>
                            <span class="brand-mark brand-mark-three">?</span>
                        </span>
                    </span>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item"><a class="nav-link active" aria-current="page"
                                href="/community.html">קהילה</a></li>
                        <li class="nav-item"><a class="nav-link" href="/bais-medrash.html">בית מדרש</a></li>
                        <li class="nav-item"><a class="nav-link" href="/coffee-room.html">קאווע צימער</a></li>
                        <li class="nav-item"><a class="nav-link" href="/bein-hasdarim.html">בין הסדרים</a></li>
                        <li class="nav-item"><a class="nav-link" href="/hearos.html">הערות</a></li>
                    </ul>
                </div>
                <a class="nav-link account-shortcut js-account-shortcut d-none" href="/nafshi.html">חשבון</a>
            </div>
        </nav>
    </div>

    <section class="community-section">
        <div class="community-wrap">
            <div class="community-topbar mb-3">
                <h1 class="mb-0">קהילה</h1>
                <a class="btn btn-outline-primary btn-sm" href="/inbox.html">Open Inbox</a>
            </div>

            <div class="community-search-shell mb-3">
                <label for="member-search" class="form-label mb-1">Search by nickname</label>
                <input id="member-search" type="search" class="form-control" placeholder="Type nickname..."
                    autocomplete="off">
                <p id="member-search-meta" class="community-meta mb-0 mt-2"></p>
            </div>

            <div id="community-grid" class="community-grid"></div>
        </div>
    </section>

    <footer class="site-footer">
        <div class="container-fluid d-flex justify-content-center align-items-center py-3">
            <p class="site-footer-text">&copy; 2026 Yeshiva Chill</p>
        </div>
    </footer>

    <div class="modal fade" id="messageModal" tabindex="-1" aria-labelledby="messageModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h4 class="modal-title" id="messageModalLabel">Send Private Message</h4>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="message-form">
                    <div class="modal-body">
                        <p class="small text-secondary mb-2">To: <strong id="message-target-label">-</strong></p>
                        <label for="message-text" class="form-label">Message</label>
                        <textarea id="message-text" class="form-control" rows="4" maxlength="500" required></textarea>
                        <p id="message-modal-status" class="auth-message mt-2" aria-live="polite"></p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
                        <button id="message-submit-btn" type="submit" class="btn auth-btn">Send</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal fade" id="inviteModal" tabindex="-1" aria-labelledby="inviteModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h4 class="modal-title" id="inviteModalLabel">Invite To Play</h4>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="invite-form">
                    <div class="modal-body">
                        <p class="small text-secondary mb-2">To: <strong id="invite-target-label">-</strong></p>

                        <label for="invite-game" class="form-label">Game</label>
                        <select id="invite-game" class="form-select" required>
                            <option value="">Choose game...</option>
                            <option value="2048">2048</option>
                            <option value="tictactoe">Tic Tac Toe</option>
                            <option value="connect4">Connect 4</option>
                            <option value="snake">Snake</option>
                            <option value="lane-racer">Lane Racer</option>
                            <option value="memory-match">Memory Match</option>
                            <option value="reaction-timer">Reaction Timer</option>
                            <option value="quick-math">Quick Math</option>
                            <option value="number-guess">Number Guess</option>
                            <option value="rps">Rock Paper Scissors</option>
                        </select>

                        <label for="invite-time" class="form-label mt-2">Proposed play time (optional)</label>
                        <input id="invite-time" type="datetime-local" class="form-control">

                        <label for="invite-note" class="form-label mt-2">Note (optional)</label>
                        <textarea id="invite-note" class="form-control" rows="3" maxlength="240"></textarea>
                        <p id="invite-modal-status" class="auth-message mt-2" aria-live="polite"></p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
                        <button id="invite-submit-btn" type="submit" class="btn auth-btn">Send Invite</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="/js/script.js"></script>
    <script src="/js/api.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script>
        const SESSION_KEY = "yeshivaChillCurrentUser";
        const currentUserKey = sessionStorage.getItem(SESSION_KEY);
        const allMembers = [];
        let activeMessageTarget = null;
        let activeInviteTarget = null;

        if (!currentUserKey) {
            window.location.href = "/nafshi.html";
        }

        const messageModalEl = document.getElementById("messageModal");
        const inviteModalEl = document.getElementById("inviteModal");
        const messageModal = bootstrap.Modal.getOrCreateInstance(messageModalEl);
        const inviteModal = bootstrap.Modal.getOrCreateInstance(inviteModalEl);

        function escapeHtml(value) {
            return String(value || "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#39;");
        }

        function getMemberLabel(user, fallbackKey) {
            return user.publicName || user.nickname || user.displayName || fallbackKey || "-";
        }

        function setStatus(id, text, type) {
            const el = document.getElementById(id);
            if (!el) return;
            el.textContent = text;
            el.classList.remove("error", "success");
            if (type) {
                el.classList.add(type);
            }
        }

        function renderMembers() {
            const query = (document.getElementById("member-search").value || "").trim().toLowerCase();
            const filtered = allMembers.filter((entry) => {
                const nickname = String(entry.user.nickname || "").toLowerCase();
                return !query || nickname.includes(query);
            });

            const grid = document.getElementById("community-grid");
            const meta = document.getElementById("member-search-meta");
            meta.textContent = `Showing ${filtered.length} of ${allMembers.length} members`;

            if (!filtered.length) {
                grid.innerHTML = '<div class="community-card"><p class="community-meta mb-0">No members match your search.</p></div>';
                return;
            }

            grid.innerHTML = filtered.map(({ key, user }) => {
                const publicName = getMemberLabel(user, key);
                const joined = user.createdAt ? new Date(user.createdAt).toLocaleDateString() : "-";
                return [
                    `<article class="community-card">`,
                    `<p class="community-name mb-1">${escapeHtml(publicName)}</p>`,
                    `<p class="community-meta mb-1">Nickname: ${escapeHtml(user.nickname || "-")}</p>`,
                    `<p class="community-meta mb-1">Name: ${escapeHtml(user.displayName || "-")}</p>`,
                    `<p class="community-meta mb-1">Joined: ${escapeHtml(joined)}</p>`,
                    `<div class="community-card-actions mt-2">`,
                    `<button type="button" class="btn btn-sm btn-outline-primary js-message-btn" data-member-key="${escapeHtml(key)}">Message</button>`,
                    `<button type="button" class="btn btn-sm auth-btn js-invite-btn" data-member-key="${escapeHtml(key)}">Invite</button>`,
                    `</div>`,
                    `</article>`
                ].join("");
            }).join("");

            grid.querySelectorAll(".js-message-btn").forEach((button) => {
                button.addEventListener("click", () => {
                    const memberKey = button.getAttribute("data-member-key");
                    activeMessageTarget = allMembers.find((entry) => entry.key === memberKey) || null;
                    if (!activeMessageTarget) return;

                    document.getElementById("message-target-label").textContent = getMemberLabel(activeMessageTarget.user, activeMessageTarget.key);
                    document.getElementById("message-text").value = "";
                    setStatus("message-modal-status", "", null);
                    messageModal.show();
                });
            });

            grid.querySelectorAll(".js-invite-btn").forEach((button) => {
                button.addEventListener("click", () => {
                    const memberKey = button.getAttribute("data-member-key");
                    activeInviteTarget = allMembers.find((entry) => entry.key === memberKey) || null;
                    if (!activeInviteTarget) return;

                    document.getElementById("invite-target-label").textContent = getMemberLabel(activeInviteTarget.user, activeInviteTarget.key);
                    document.getElementById("invite-game").value = "";
                    document.getElementById("invite-time").value = "";
                    document.getElementById("invite-note").value = "";
                    setStatus("invite-modal-status", "", null);
                    inviteModal.show();
                });
            });
        }

        async function loadCommunity() {
            const response = await window.yeshivaChillApi.getCommunity(currentUserKey);
            const entries = response.users || [];
            allMembers.length = 0;
            entries.forEach((entry) => {
                allMembers.push(entry);
            });
            renderMembers();
        }

        document.getElementById("member-search").addEventListener("input", renderMembers);

        document.getElementById("message-form").addEventListener("submit", async (event) => {
            event.preventDefault();
            if (!activeMessageTarget) return;

            const submitBtn = document.getElementById("message-submit-btn");
            const messageText = document.getElementById("message-text").value.trim();
            if (!messageText) {
                setStatus("message-modal-status", "Please type a message.", "error");
                return;
            }

            submitBtn.disabled = true;
            try {
                await window.yeshivaChillApi.sendMessageToMember(currentUserKey, activeMessageTarget.key, messageText);
                setStatus("message-modal-status", "Message sent.", "success");
                setTimeout(() => messageModal.hide(), 450);
            } catch (error) {
                setStatus("message-modal-status", String(error.message || "Failed to send message."), "error");
            } finally {
                submitBtn.disabled = false;
            }
        });

        document.getElementById("invite-form").addEventListener("submit", async (event) => {
            event.preventDefault();
            if (!activeInviteTarget) return;

            const submitBtn = document.getElementById("invite-submit-btn");
            const gameKey = document.getElementById("invite-game").value.trim();
            const proposedTime = document.getElementById("invite-time").value;
            const note = document.getElementById("invite-note").value.trim();

            if (!gameKey) {
                setStatus("invite-modal-status", "Choose a game first.", "error");
                return;
            }

            submitBtn.disabled = true;
            try {
                await window.yeshivaChillApi.sendInvite({
                    fromUserKey: currentUserKey,
                    toUserKey: activeInviteTarget.key,
                    gameKey,
                    proposedTime,
                    note
                });
                setStatus("invite-modal-status", "Invite sent.", "success");
                setTimeout(() => inviteModal.hide(), 450);
            } catch (error) {
                setStatus("invite-modal-status", String(error.message || "Failed to send invite."), "error");
            } finally {
                submitBtn.disabled = false;
            }
        });

        loadCommunity().catch((error) => {
            console.error(error);
            const grid = document.getElementById("community-grid");
            grid.innerHTML = '<div class="community-card"><p class="community-meta mb-0">Could not load members right now.</p></div>';
        });
    </script>
</body>

</html>
